<!DOCTYPE html>
<html>
<head>
  <title>Emoji Soundboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>🎧 Soundboard</h2>

  <div class="board">
    <button class="btn" data-sound="dog">🐶 Dog</button>
    <button class="btn" data-sound="clap">👏 Clap</button>
    <button class="btn" data-sound="pop">💥 Pop</button>
    <button class="btn" data-sound="laugh">😂 Laugh</button>
    <button class="btn" data-sound="bell">🔔 Bell</button>
  <button class="btn" data-sound="horn">🚗 Horn</button>
  </div>

  <div class="controls">
    <span>🔊 Volume:</span>
    <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
    <button id="muteBtn">🔇 Mute</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
